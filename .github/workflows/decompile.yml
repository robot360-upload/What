name: Decompile ELF

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Ghidra
        run: |
          GHIDRA_URL=$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -n 1)

          echo "Ghidra URL:"
          echo "$GHIDRA_URL"

          wget -q --show-progress "$GHIDRA_URL" -O ghidra.zip

          unzip -q ghidra.zip

          GHIDRA_DIR=$(find . -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)

          if [ -z "$GHIDRA_DIR" ]; then
            echo "Could not find Ghidra directory"
            exit 1
          fi

          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Check ELF
        run: |
          file library.so
          readelf -h library.so

      - name: Create Ghidra project
        run: |
          mkdir -p ghidra-project
          mkdir -p output

          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$(pwd)/ghidra-project" \
            ELFProject \
            -import "$(pwd)/library.so" \
            -analysisTimeoutPerFile 600 \
            -deleteProject

      - name: Create C pseudocode exporter
        run: |
          mkdir -p scripts

          cat > scripts/ExportC.java <<'EOF'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;

          public class ExportC extends GhidraScript {

              @Override
              public void run() throws Exception {

                  DecompInterface decompiler =
                      new DecompInterface();

                  decompiler.openProgram(currentProgram);

                  FunctionIterator functions =
                      currentProgram
                          .getFunctionManager()
                          .getFunctions(true);

                  java.io.File out =
                      new java.io.File(getScriptArgs()[0]);

                  java.io.PrintWriter writer =
                      new java.io.PrintWriter(out);

                  while (functions.hasNext()
                         && !monitor.isCancelled()) {

                      Function function =
                          functions.next();

                      writer.println(
                          "/* ======================================== */"
                      );

                      writer.println(
                          "/* " + function.getName() + " */"
                      );

                      writer.println(
                          "/* Address: "
                          + function.getEntryPoint()
                          + " */"
                      );

                      writer.println(
                          "/* ======================================== */"
                      );

                      DecompileResults result =
                          decompiler.decompileFunction(
                              function,
                              60,
                              monitor
                          );

                      if (result.decompileCompleted()) {

                          writer.println(
                              result
                                  .getDecompiledFunction()
                                  .getC()
                          );

                      } else {

                          writer.println(
                              "/* Decompilation failed */"
                          );
                      }

                      writer.println();
                  }

                  writer.close();
                  decompiler.dispose();
              }
          }
          EOF

      - name: Export C pseudocode
        run: |
          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$(pwd)/ghidra-project" \
            ELFProject \
            -process library.so \
            -scriptPath "$(pwd)/scripts" \
            -postScript ExportC.java \
            "$(pwd)/output/pseudocode.c"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-elf
          path: |
            output/pseudocode.c
