name: Decompile ELF

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest Ghidra
        shell: bash
        run: |
          set -e

          echo "Finding latest Ghidra release..."

          GHIDRA_URL=$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '
                .assets[]
                | select(.name | endswith(".zip"))
                | .browser_download_url
              ' \
            | head -n 1)

          if [ -z "$GHIDRA_URL" ] || [ "$GHIDRA_URL" = "null" ]; then
            echo "ERROR: Could not find Ghidra ZIP."
            exit 1
          fi

          echo "Downloading:"
          echo "$GHIDRA_URL"

          wget -q --show-progress \
            "$GHIDRA_URL" \
            -O ghidra.zip

          echo "Extracting Ghidra..."

          unzip -q ghidra.zip

          GHIDRA_DIR=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type d \
            -name 'ghidra_*_PUBLIC' \
            | head -n 1)

          if [ -z "$GHIDRA_DIR" ]; then
            echo "ERROR: Ghidra directory was not found."
            ls -la
            exit 1
          fi

          echo "Ghidra directory:"
          echo "$GHIDRA_DIR"

          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Check ELF
        shell: bash
        run: |
          set -e

          if [ ! -f library.so ]; then
            echo "ERROR: library.so was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "===== ELF information ====="

          file library.so

          echo
          echo "===== ELF Header ====="

          readelf -h library.so

          echo
          echo "===== Architecture ====="

          readelf -h library.so | grep -E \
            'Class:|Data:|Machine:|Type:'

      - name: Create Ghidra export script
        shell: bash
        run: |
          set -e

          mkdir -p scripts
          mkdir -p output
          mkdir -p ghidra-project

          cat > scripts/ExportC.java <<'EOF'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;

          public class ExportC extends GhidraScript {

              @Override
              public void run() throws Exception {

                  String[] args = getScriptArgs();

                  if (args.length < 1) {
                      println("ERROR: Output file not specified.");
                      return;
                  }

                  String outputPath = args[0];

                  println("========================================");
                  println("Starting C pseudocode export");
                  println("Output: " + outputPath);
                  println("========================================");

                  DecompInterface decompiler =
                      new DecompInterface();

                  decompiler.openProgram(currentProgram);

                  java.io.PrintWriter writer =
                      new java.io.PrintWriter(
                          new java.io.File(outputPath)
                      );

                  FunctionIterator functions =
                      currentProgram
                          .getFunctionManager()
                          .getFunctions(true);

                  int total = 0;
                  int successful = 0;
                  int failed = 0;

                  while (functions.hasNext()
                         && !monitor.isCancelled()) {

                      Function function = functions.next();

                      total++;

                      println(
                          "[" + total + "] Decompiling: "
                          + function.getName()
                          + " @ "
                          + function.getEntryPoint()
                      );

                      writer.println(
                          "/* ======================================== */"
                      );

                      writer.println(
                          "/* Function: "
                          + function.getName()
                          + " */"
                      );

                      writer.println(
                          "/* Address: "
                          + function.getEntryPoint()
                          + " */"
                      );

                      writer.println(
                          "/* ======================================== */"
                      );

                      DecompileResults result =
                          decompiler.decompileFunction(
                              function,
                              120,
                              monitor
                          );

                      if (result.decompileCompleted()
                          && result.getDecompiledFunction() != null) {

                          writer.println(
                              result
                                  .getDecompiledFunction()
                                  .getC()
                          );

                          successful++;

                      } else {

                          writer.println(
                              "/* Decompilation failed */"
                          );

                          failed++;
                      }

                      writer.println();
                      writer.flush();
                  }

                  writer.close();

                  decompiler.dispose();

                  println("========================================");
                  println("Decompilation finished");
                  println("Functions found: " + total);
                  println("Successful: " + successful);
                  println("Failed: " + failed);
                  println("Output: " + outputPath);
                  println("========================================");
              }
          }
          EOF

      - name: Analyze ELF and export C pseudocode
        shell: bash
        run: |
          set -e

          echo "Starting Ghidra..."

          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra-project" \
            ELFProject \
            -import "$GITHUB_WORKSPACE/library.so" \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportC.java \
            "$GITHUB_WORKSPACE/output/pseudocode.c" \
            -analysisTimeoutPerFile 1200

      - name: Generate additional ELF information
        shell: bash
        run: |
          set -e

          readelf -h library.so \
            > output/elf-header.txt

          readelf -S library.so \
            > output/sections.txt

          readelf -l library.so \
            > output/program-headers.txt

          readelf -d library.so \
            > output/dynamic.txt

          readelf -s library.so \
            > output/symbols.txt

          readelf -r library.so \
            > output/relocations.txt

          strings -a library.so \
            > output/strings.txt

          objdump -d library.so \
            > output/disassembly.txt || true

      - name: Show output information
        shell: bash
        run: |
          echo "===== Output files ====="

          find output -type f -printf '%p %s bytes\n'

          echo
          echo "===== Pseudocode size ====="

          wc -l output/pseudocode.c

          echo
          echo "===== First 100 lines ====="

          head -n 100 output/pseudocode.c

      - name: Upload decompilation results
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-elf
          path: output/
          if-no-files-found: error
          retention-days: 7
